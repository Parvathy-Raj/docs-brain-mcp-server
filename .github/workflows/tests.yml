name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No torch / models in CI: the tests use fixture pages and a fake retriever.
      - run: pip install -r requirements-ci.txt && pip install -e . --no-deps
      - run: ruff check .
      - run: pytest -q
